[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hwdesign"
version = "0.3.2"
description = "Electronics and mechanical design as code: KiCad schematics and boards from Python, Freerouting with cleanup and layout checks, JLCPCB fab files, and build123d enclosure checks."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dennis Witzig" }]
requires-python = ">=3.11"
# hwdesign.kicad needs KiCad's own Python module `pcbnew` (not on PyPI): use the Python that
# ships with KiCad, or a venv created with --system-site-packages.
dependencies = []

[project.optional-dependencies]
mcad = ["build123d>=0.13", "numpy>=2.0", "scipy>=1.13"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/dwzg/hw-design"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E741"]   # l/I/O as names: common in geometry code (layer, index)

[tool.pytest.ini_options]
testpaths = ["tests"]
