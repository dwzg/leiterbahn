[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leiterbahn"
version = "0.10.0"
description = "Circuit boards as code: KiCad schematics and boards from Python, a router of its own (all nets at once), layout checks DRC cannot do, and JLCPCB fab files."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dennis Witzig" }]
requires-python = ">=3.11"
# leiterbahn.kicad needs KiCad's own Python module `pcbnew` (not on PyPI): use the Python that
# ships with KiCad, or a venv created with --system-site-packages.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/dwzg/leiterbahn"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E741"]   # l/I/O as names: common in geometry code (layer, index)

[tool.pytest.ini_options]
testpaths = ["tests"]
