[package]
name = "leiterbahn-route"
version = "0.1.0"
edition = "2021"
description = "Grid router with negotiated congestion, the router of leiterbahn: all nets at once, no net order"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
